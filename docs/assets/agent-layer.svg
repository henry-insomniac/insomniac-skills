<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Agent collaboration layer architecture</title>
  <desc id="desc">A product style layered diagram showing AGENTS.md, DESIGN.md, .claude, docs/agents, docs/adr, CONTEXT files, and optional skills.</desc>
  <defs>
    <filter id="productShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
    <style>
      .mono{font:700 20px "SF Mono",SFMono-Regular,Menlo,Consolas,monospace;fill:#1d1d1f}
      .monoDark{font:700 20px "SF Mono",SFMono-Regular,Menlo,Consolas,monospace;fill:#ffffff}
      .label{font:600 34px -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;fill:#1d1d1f}
      .small{font:500 17px -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;fill:#7a7a7a}
      .smallDark{font:500 17px -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;fill:#cccccc}
      .caption{font:600 15px -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;fill:#0066cc}
    </style>
  </defs>
  <rect width="1200" height="700" rx="22" fill="#f5f5f7"/>
  <text x="90" y="92" class="caption">INSOMNIAC-SKILLS GENERATED LAYER</text>
  <text x="90" y="136" class="label">One repo surface. Four agent responsibilities.</text>
  <text x="90" y="170" class="small">Project truth, visual policy, operating process, and optional workflows are kept apart.</text>

  <g filter="url(#productShadow)">
    <rect x="90" y="226" width="1020" height="112" rx="18" fill="#ffffff"/>
    <text x="130" y="275" class="mono">AGENTS.md</text>
    <text x="130" y="307" class="small">The first-read contract for every coding agent.</text>
    <circle cx="1050" cy="282" r="17" fill="#0066cc"/>
    <path d="M1042 282h16M1050 274v16" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

    <rect x="90" y="382" width="318" height="178" rx="18" fill="#ffffff"/>
    <text x="130" y="432" class="mono">DESIGN.md</text>
    <text x="130" y="464" class="small">Tokens, component rules,</text>
    <text x="130" y="490" class="small">layout and UI boundaries.</text>
    <path d="M130 520h118" stroke="#0066cc" stroke-width="5" stroke-linecap="round"/>

    <rect x="441" y="382" width="318" height="178" rx="18" fill="#000000"/>
    <text x="481" y="432" class="monoDark">.claude/</text>
    <text x="481" y="464" class="smallDark">Architecture, tech stack,</text>
    <text x="481" y="490" class="smallDark">Git rules and bug history.</text>
    <path d="M481 520h118" stroke="#2997ff" stroke-width="5" stroke-linecap="round"/>

    <rect x="792" y="382" width="318" height="178" rx="18" fill="#ffffff"/>
    <text x="832" y="432" class="mono">docs/agents</text>
    <text x="832" y="464" class="small">Issue tracker, triage,</text>
    <text x="832" y="490" class="small">domain and ADR rules.</text>
    <path d="M832 520h118" stroke="#0066cc" stroke-width="5" stroke-linecap="round"/>

    <rect x="314" y="594" width="572" height="74" rx="18" fill="#0066cc"/>
    <text x="354" y="641" class="monoDark">skills/core</text>
    <text x="542" y="641" class="smallDark">optional reusable local workflows</text>
  </g>

  <path d="M600 338v34" stroke="#d2d2d7" stroke-width="4" stroke-linecap="round"/>
  <path d="M249 560v24M600 560v24M951 560v24" stroke="#d2d2d7" stroke-width="4" stroke-linecap="round"/>
  <path d="M249 584h702" stroke="#d2d2d7" stroke-width="4" stroke-linecap="round"/>
</svg>
