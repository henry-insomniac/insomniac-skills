<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc">
  <title id="title">Agent collaboration layer architecture</title>
  <desc id="desc">A layered diagram showing AGENTS.md, DESIGN.md, .claude, docs/agents, docs/adr, CONTEXT files, and optional skills.</desc>
  <defs>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff8ec"/>
      <stop offset="1" stop-color="#edf7f2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#3d3327" flood-opacity="0.16"/>
    </filter>
    <style>
      .label{font:700 26px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#231d17}
      .small{font:500 17px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#57483a}
      .mono{font:700 18px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#231d17}
      .note{font:500 15px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#6a5a49}
    </style>
  </defs>
  <rect width="1040" height="620" rx="36" fill="url(#paper)"/>
  <g filter="url(#shadow)">
    <rect x="88" y="78" width="864" height="112" rx="24" fill="#fffdf8" stroke="#d6c8b4" stroke-width="2"/>
    <text x="126" y="122" class="mono">AGENTS.md</text>
    <text x="126" y="155" class="small">First-read project contract for every coding agent</text>
    <text x="126" y="177" class="note">入口约定：工作原则、验证方式、关键文档索引</text>

    <rect x="88" y="228" width="390" height="118" rx="24" fill="#f3faf5" stroke="#b6d7c3" stroke-width="2"/>
    <text x="126" y="271" class="mono">DESIGN.md</text>
    <text x="126" y="304" class="small">Visual tokens and UI design rules</text>
    <text x="126" y="326" class="note">颜色、字体、间距、组件和禁用项</text>

    <rect x="562" y="228" width="390" height="118" rx="24" fill="#fff7ee" stroke="#dfc1a0" stroke-width="2"/>
    <text x="600" y="271" class="mono">.claude/</text>
    <text x="600" y="304" class="small">Long-term project context</text>
    <text x="600" y="326" class="note">架构、技术栈、Git 规则和 bug 复盘</text>

    <rect x="88" y="384" width="390" height="118" rx="24" fill="#f4f7ff" stroke="#bdc8e6" stroke-width="2"/>
    <text x="126" y="427" class="mono">docs/agents/</text>
    <text x="126" y="460" class="small">Issue, triage, domain, and skill rules</text>
    <text x="126" y="482" class="note">Agent 操作规则层，可选生成</text>

    <rect x="562" y="384" width="390" height="118" rx="24" fill="#fdf4f4" stroke="#e7bbbb" stroke-width="2"/>
    <text x="600" y="427" class="mono">skills/core/</text>
    <text x="600" y="460" class="small">Reusable local Agent workflows</text>
    <text x="600" y="482" class="note">默认不安装，按 profile 显式启用</text>
  </g>
  <path d="M520 191v30" stroke="#9b7b57" stroke-width="4" stroke-linecap="round"/>
  <path d="M283 347v30M757 347v30M478 443h76" stroke="#9b7b57" stroke-width="4" stroke-linecap="round"/>
  <text x="88" y="560" class="label">One command creates a shared operating system for agents.</text>
  <text x="88" y="590" class="small">一个命令，把协作文档、设计约束、领域上下文和可复用 skills 接到项目里。</text>
</svg>
